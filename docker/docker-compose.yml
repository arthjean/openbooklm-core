# The OpenbookLM self-hosting stack (US-015, EP-004).
#
#   cp .env.example .env      # fill VOYAGE_API_KEY, one LLM key, OPENBOOKLM_AUTH_TOKEN
#   docker compose -f docker/docker-compose.yml up --build
#   curl -H "authorization: Bearer $OPENBOOKLM_AUTH_TOKEN" localhost:3001/api/notebooks
#
# Two services and one volume. PostgreSQL with pgvector is a hard prerequisite,
# not an option: retrieval is the product.

name: openbooklm

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbooklm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbooklm}
      POSTGRES_DB: ${POSTGRES_DB:-openbooklm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on loopback only. The database is the server's dependency, not
    # a service anyone else should reach; comment this out to inspect it with a
    # local client.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # `-d` matters: without it pg_isready reports the server is up before the
      # application database exists, and the first migration races the initdb
      # script that creates it.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbooklm} -d ${POSTGRES_DB:-openbooklm}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openbooklm

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      # Overrides whatever .env says: inside the network the database is
      # `postgres`, never localhost.
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-openbooklm}:${POSTGRES_PASSWORD:-openbooklm}@postgres:5432/${POSTGRES_DB:-openbooklm}
      OPENBOOKLM_BIND: 0.0.0.0
      # Passed through so `OPENBOOKLM_DETERMINISTIC_PROVIDERS=true docker compose up`
      # brings up a stack that needs no provider account.
      OPENBOOKLM_DETERMINISTIC_PROVIDERS: ${OPENBOOKLM_DETERMINISTIC_PROVIDERS:-false}
    ports:
      - "${OPENBOOKLM_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The server writes nothing to disk: documents live in PostgreSQL and logs
    # go to stdout.
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openbooklm

networks:
  openbooklm:
    driver: bridge

volumes:
  postgres_data:
